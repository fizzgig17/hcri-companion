apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard/R8 on Release builds to minify and shrink
 * the Java/Kotlin bytecode. Play Store submissions should ship with this on
 * -- a smaller, harder-to-reverse-engineer release build, and no real
 * downside now that it's verified working (see proguard-rules.pro for the
 * native-module keep rules react-native-ble-plx and friends need).
 *
 * Confirmed 2026-10-03: this ran on EVERY release build, dev sideloads
 * included -- which is also why a dev build's own crash stack traces
 * came out obfuscated (see MainActivity.kt's comment on the react-
 * native-screens crash this session tracked down: its trace was full of
 * r8-map-id-prefixed hashes and single/double-letter class names like
 * "ab:"/"bb:" instead of real ones, not just hard to build quickly).
 * R8 is also real build time on top of the native-architecture cost
 * below, spent on a build that only ever gets installed on one test
 * phone and gets rebuilt constantly. deploy-dev.yml now passes
 * `-PdisableMinifyForDev=true` to skip this; deploy-master.yml -- the
 * actual Play Store-bound build -- leaves the property unset, so it
 * keeps minifying exactly as before.
 */
def enableProguardInReleaseBuilds = !project.hasProperty('disableMinifyForDev')

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = variant.name == "release" ? "hCRICompanion.apk" : "hCRICompanion-${variant.name}.apk"
        }
    }
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.hcricompanion"
    defaultConfig {
        applicationId "com.hcricompanion"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Also update src/buildInfo.ts (APP_VERSION/BUILD_DATE) in the same
        // commit -- that's the JS-visible copy of this, shown at the top of
        // Settings. Gradle values here aren't reachable from JS directly.
        versionCode 16
        versionName "1.13"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Reads from gradle.properties (or, better, your global
        // ~/.gradle/gradle.properties so the real values never sit inside
        // the project folder at all -- see the setup notes for how to
        // generate hcricompanion-release.keystore and fill these in as
        // HCRICOMPANION_RELEASE_STORE_FILE etc). Falls through to nothing
        // configured until you've done that, which the release buildType
        // below checks for rather than assuming.
        release {
            if (project.hasProperty('HCRICOMPANION_RELEASE_STORE_FILE')) {
                storeFile file(HCRICOMPANION_RELEASE_STORE_FILE)
                storePassword HCRICOMPANION_RELEASE_STORE_PASSWORD
                keyAlias HCRICOMPANION_RELEASE_KEY_ALIAS
                keyPassword HCRICOMPANION_RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // IMPORTANT: this used to just be `signingConfig
            // signingConfigs.debug` -- meaning every "release" build was
            // signed with the well-known public debug key. That's fine for
            // testing on your own device, but Play Console will refuse an
            // upload signed that way, and a debug-signed APK isn't safe to
            // distribute to anyone else either (the debug keystore's
            // password is the same "android" on every React Native install
            // in existence). This now uses your real release keystore once
            // HCRICOMPANION_RELEASE_STORE_FILE etc. are set (see gradle.properties
            // notes) -- and falls back to the debug key ONLY so a plain
            // `assembleRelease` doesn't hard-fail before you've generated
            // one yet. Don't upload a build to Play until you see it
            // actually pick up the release config, not this fallback.
            signingConfig project.hasProperty('HCRICOMPANION_RELEASE_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // Google Play In-App Updates (update check + "update now" flow).
    implementation("com.google.android.play:app-update:2.1.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}