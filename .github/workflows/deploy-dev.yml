# .github/workflows/deploy-dev.yml
#
# Builds a release-signed APK on every push to `develop` and publishes it as
# a GitHub Release asset, at a fixed, moving tag ("dev-latest") rather than
# a new tag per build -- so the download URL never changes and dev.hcri.io's
# companion page (hcri.io repo's companion/index.html) can link straight to
# it without ever needing to be hand-edited. Mirrors deploy-master.yml
# (which does the same for `master` under the tag "prod-latest") -- see
# that file for the fuller explanation of the shared build steps.
#
# Used to scp the APK onto dev.hcri.io directly (see git history before
# this change) -- moved to GitHub Releases instead so the Spaceship account
# never has to receive the binary at all; the companion page just redirects
# to wherever GitHub is actually hosting it.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64     - `base64 -w0 hcricompanion-release.keystore`
#   HCRICOMPANION_RELEASE_STORE_PASSWORD
#   HCRICOMPANION_RELEASE_KEY_ALIAS
#   HCRICOMPANION_RELEASE_KEY_PASSWORD
# No SPACESHIP_* secrets needed by this workflow any more -- those were only
# ever used by the scp-action step this replaced.
#
# One-time repo setting this relies on: Settings -> Actions -> General ->
# "Workflow permissions" must be "Read and write permissions" (not the
# default "Read repository contents permission" in some org/repo defaults)
# -- otherwise the release-publish step below gets a 403, since it needs to
# create/update a release and upload an asset using the built-in
# GITHUB_TOKEN rather than a separate PAT.

name: Build and publish APK (dev)

on:
  push:
    branches: [develop]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Caches the Gradle wrapper distribution, dependency cache, and build
      # cache across runs (keyed off the wrapper/build.gradle files, so a
      # dependency bump invalidates it automatically) -- cuts the Android
      # build step from ~10-15 min down to a couple minutes on a cache hit.
      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      # Point this build at dev.hcri.io instead of the production API, so
      # anything uploaded from a dev-built APK can never land in production
      # data by accident. See src/hcri/apiConfig.ts for the full story.
      - name: Point build at dev.hcri.io
        run: echo "export const HCRI_API_BASE = 'https://dev.hcri.io';" > src/hcri/apiConfig.ts

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/hcricompanion-release.keystore

      # Dev builds only ever get installed by direct APK sideload off the
      # companion page -- the AAB (Android App Bundle) only exists for a
      # Play Console submission, which only ever happens from a `master`
      # build (see deploy-master.yml, which still builds both). Building it
      # here too was pure wasted build time for an artifact nobody uses:
      # assembleRelease alone, not assembleRelease+bundleRelease.
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PHCRICOMPANION_RELEASE_STORE_FILE=hcricompanion-release.keystore \
            -PHCRICOMPANION_RELEASE_STORE_PASSWORD="${{ secrets.HCRICOMPANION_RELEASE_STORE_PASSWORD }}" \
            -PHCRICOMPANION_RELEASE_KEY_ALIAS="${{ secrets.HCRICOMPANION_RELEASE_KEY_ALIAS }}" \
            -PHCRICOMPANION_RELEASE_KEY_PASSWORD="${{ secrets.HCRICOMPANION_RELEASE_KEY_PASSWORD }}"

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/hcricompanion-release.keystore

      # android/app/build.gradle already names the release APK output
      # hCRICompanion.apk itself (applicationVariants.all{} outputFileName),
      # so this just moves it up next to the workflow rather than renaming
      # an "app-release.apk" that was never actually produced.
      - name: Move APK
        run: cp android/app/build/outputs/apk/release/hCRICompanion.apk hCRICompanion.apk

      # Moves (doesn't copy) the "dev-latest" tag to this commit every run,
      # so the release this points to is always the one just built here --
      # same idea as the old scp-action's `overwrite: true`, just for a
      # GitHub release instead of a server file.
      - name: Move dev-latest tag to this commit
        run: |
          git tag -f dev-latest
          git push origin -f dev-latest

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "Dev build (${{ github.sha }})"
          prerelease: true
          body: |
            Automatically published from `develop` at ${{ github.sha }}.
            This release is overwritten on every push to `develop` -- it's
            not a stable version history, just a fixed place for
            dev.hcri.io's companion page to link to.

            Includes the installable APK (hCRICompanion.apk) for direct
            sideload. No AAB here -- that's only ever needed for a Play
            Console submission, which is built from `master` instead (see
            deploy-master.yml).
          files: |
            hCRICompanion.apk
