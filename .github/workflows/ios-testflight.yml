# .github/workflows/ios-testflight.yml
#
# Builds a SIGNED release of the iOS app and uploads it to TestFlight (App Store Connect).
# Manual for now (Actions tab -> "Upload iOS build to TestFlight" -> Run workflow; choose the branch: master = production site,
# develop = dev.hcri.io). Once one upload has worked,
# add `push: branches: [master]` under `on:` below to upload on every push to master.
#
# One-time setup (needs an active, paid Apple Developer Program membership):
#   1. App Store Connect -> Apps -> + -> New App, bundle ID io.hcri.companion.
#   2. App Store Connect -> Users and Access -> Integrations -> App Store Connect API -> create a key.
#      Use the Admin role if the build complains it cannot create a distribution certificate.
#      Download the .p8 file (Apple lets you download it once).
#   3. GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret:
#        ASC_KEY_ID      the key's Key ID
#        ASC_ISSUER_ID   the Issuer ID shown above the key list
#        ASC_KEY_P8      the whole text of the .p8 file, including the BEGIN/END lines
#        APPLE_TEAM_ID   your 10-character Team ID
#
# Signing: with the four secrets below set, the build signs with YOUR Apple Distribution certificate and App Store
# provisioning profile (stored as secrets), so no new certificate is created on each run (Apple caps how many an
# account may hold, and automatic signing on a fresh runner kept creating new ones until the build failed).
#        IOS_DIST_P12            base64 of the Apple Distribution certificate + key (.p12)
#        IOS_DIST_P12_PASSWORD   the .p12 password
#        IOS_PROFILE             base64 of the App Store .mobileprovision for io.hcri.companion
#        IOS_PROFILE_NAME        the profile's name (informational; the name inside the file is what is used)
# Without them it falls back to automatic signing (-allowProvisioningUpdates) with the API key. The API key is still
# used either way, to upload to TestFlight and to write each build's "What to Test" text.
# The build number is the GitHub run number, so every upload has a higher one than the last.
# The version shown to testers is MARKETING_VERSION in the Xcode project (bump it with each release).

name: Upload iOS build to TestFlight

on:
  workflow_dispatch: {}

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see the setup notes at the top of this workflow file)"
            exit 1
          fi

      # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26 or later); the runner's default Xcode is older.
      - name: Select Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$X" ]; then
            echo "::error::No Xcode 26 on this runner image. Installed: $(ls /Applications | grep -i xcode | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install JS dependencies
        run: npm ci

      # master builds talk to production; any other branch (develop) talks to dev.hcri.io and shows the DEV BUILD strip.
      - name: Point build at the right hCRI.io site
        run: |
          if [ "${GITHUB_REF_NAME}" = "master" ]; then BASE='https://www.hcri.io'; else BASE='https://dev.hcri.io'; fi
          echo "Building against $BASE"
          echo "export const HCRI_API_BASE = '$BASE';" > src/hcri/apiConfig.ts

      - name: Stamp git commit id into the build
        run: |
          echo "export const GIT_COMMIT = '${GITHUB_SHA::7}';" > src/gitCommit.ts
          echo "export const IOS_BUILD_NUMBER = '${{ github.run_number }}';" > src/buildNumber.ts

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'package-lock.json') }}

      - name: Install CocoaPods
        working-directory: ios
        run: bundle exec pod install

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"

      # Your own signing certificate + profile (see the header). Skipped, falling back to automatic signing, if unset.
      - name: Install the signing certificate and profile
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
        run: |
          if [ -z "$IOS_DIST_P12" ] || [ -z "$IOS_PROFILE" ]; then
            echo "No IOS_DIST_P12 / IOS_PROFILE secrets: using automatic signing."
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPASS="$(uuidgen)"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          printf '%s' "$IOS_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          security find-identity -v -p codesigning "$KC"
          rm -f "$RUNNER_TEMP/dist.p12"

          printf '%s' "$IOS_PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PUUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PNAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PAPP=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          echo "Profile: $PNAME ($PUUID) for $PAPP"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PUUID.mobileprovision"
          echo "SIGN_MANUAL=1" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PNAME" >> "$GITHUB_ENV"

      - name: Archive (signed, Release)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          if [ "$SIGN_MANUAL" = "1" ]; then
            # Manual signing for the app target only (the Pods targets must stay as they are), written into the project.
            PROFILE_NAME="$PROFILE_NAME" APPLE_TEAM_ID="$APPLE_TEAM_ID" bundle exec ruby -e '
              require "xcodeproj"
              proj = Xcodeproj::Project.open("ios/hCRICompanion.xcodeproj")
              target = proj.targets.find { |t| t.name == "hCRICompanion" } or abort("target hCRICompanion not found")
              target.build_configurations.each do |c|
                s = c.build_settings
                s["CODE_SIGN_STYLE"] = "Manual"
                s["DEVELOPMENT_TEAM"] = ENV["APPLE_TEAM_ID"]
                s["CODE_SIGN_IDENTITY"] = "Apple Distribution"
                s["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
                s["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PROFILE_NAME"]
              end
              proj.save
            '
            AUTH_FLAGS=""
          else
            AUTH_FLAGS="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/asc/AuthKey.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          fi
          xcodebuild \
            -workspace ios/hCRICompanion.xcworkspace \
            -scheme hCRICompanion \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/hCRI.xcarchive" \
            $AUTH_FLAGS \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive 2>&1 | tee xcodebuild-archive.log | tail -n 40

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          if [ "$SIGN_MANUAL" = "1" ]; then
            SIGN_STYLE=manual
            SIGN_EXTRA="<key>signingCertificate</key><string>Apple Distribution</string><key>provisioningProfiles</key><dict><key>io.hcri.companion</key><string>${PROFILE_NAME}</string></dict>"
          else
            SIGN_STYLE=automatic
            SIGN_EXTRA=""
          fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>${SIGN_STYLE}</string>
            ${SIGN_EXTRA}
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          # The API key is still what authenticates the upload; -allowProvisioningUpdates only for automatic signing.
          if [ "$SIGN_MANUAL" = "1" ]; then EXTRA_FLAGS=""; else EXTRA_FLAGS="-allowProvisioningUpdates"; fi
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/hCRI.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            $EXTRA_FLAGS \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee xcodebuild-export.log | tail -n 40

      # TestFlight's builds list only shows version + build number, so write the branch, commit and server into each
      # build's "What to Test" text (open the build in App Store Connect to read it). Best effort: never fails the run,
      # since the build itself is already uploaded.
      - name: Label the build in TestFlight (What to Test)
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import json, os, subprocess, time, urllib.request, urllib.error, jwt

          APP_ID = '6821508876'
          key = open(os.path.join(os.environ['RUNNER_TEMP'], 'asc', 'AuthKey.p8')).read()
          sha = os.environ.get('GITHUB_SHA', '')[:7]
          subject = subprocess.run(['git', 'log', '-1', '--pretty=%s'], capture_output=True, text=True).stdout.strip()
          branch = os.environ['BRANCH']
          server = 'www.hcri.io (production)' if branch == 'master' else 'dev.hcri.io (development)'
          text = f"{'PRODUCTION' if branch == 'master' else 'DEVELOPMENT'} build\nBranch: {branch}\nCommit: {sha}\nServer: {server}\n{subject}"[:3900]

          def token():
              now = int(time.time())
              return jwt.encode({'iss': os.environ['ASC_ISSUER_ID'], 'iat': now, 'exp': now + 1100, 'aud': 'appstoreconnect-v1'},
                                key, algorithm='ES256', headers={'kid': os.environ['ASC_KEY_ID']})

          def call(method, path, body=None):
              req = urllib.request.Request('https://api.appstoreconnect.apple.com' + path, method=method,
                                           data=json.dumps(body).encode() if body is not None else None,
                                           headers={'Authorization': 'Bearer ' + token(), 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw = r.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raise SystemExit(f'{method} {path} -> {e.code}: {e.read().decode()[:500]}')

          build_id = None
          for _ in range(50):  # up to ~25 minutes for the upload to show up
              r = call('GET', f"/v1/builds?filter[app]={APP_ID}&filter[version]={os.environ['BUILD_NUMBER']}&limit=5")
              if r.get('data'):
                  build_id = r['data'][0]['id']
                  break
              time.sleep(30)
          if not build_id:
              raise SystemExit('Build did not appear in App Store Connect in time; label it by hand if needed.')

          locs = call('GET', f'/v1/builds/{build_id}/betaBuildLocalizations').get('data', [])
          mine = next((l for l in locs if l['attributes'].get('locale') == 'en-US'), None)
          if mine:
              call('PATCH', f"/v1/betaBuildLocalizations/{mine['id']}", {'data': {'type': 'betaBuildLocalizations', 'id': mine['id'], 'attributes': {'whatsNew': text}}})
          else:
              call('POST', '/v1/betaBuildLocalizations', {'data': {'type': 'betaBuildLocalizations', 'attributes': {'locale': 'en-US', 'whatsNew': text},
                                                                   'relationships': {'build': {'data': {'type': 'builds', 'id': build_id}}}}})
          print('Labeled build', os.environ['BUILD_NUMBER'], 'as', branch)
          PY

      # `gh` in the authoring sandbox can't download logs, so surface the real errors as annotations on failure.
      - name: Annotate errors
        if: failure()
        run: |
          cat xcodebuild-archive.log xcodebuild-export.log 2>/dev/null | grep -E ": error: |^error: |fatal error: |\*\* (ARCHIVE|EXPORT) FAILED|Validation failed|SDK version|Undefined symbols|No profiles|No signing certificate|Provisioning profile" | head -n 20 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
