# .github/workflows/ios-testflight.yml
#
# Builds a SIGNED release of the iOS app and uploads it to TestFlight (App Store Connect).
# Manual for now (Actions tab -> "Upload iOS build to TestFlight" -> Run workflow). Once one upload has worked,
# add `push: branches: [master]` under `on:` below to upload on every push to master.
#
# One-time setup (needs an active, paid Apple Developer Program membership):
#   1. App Store Connect -> Apps -> + -> New App, bundle ID io.hcri.companion.
#   2. App Store Connect -> Users and Access -> Integrations -> App Store Connect API -> create a key.
#      Use the Admin role if the build complains it cannot create a distribution certificate.
#      Download the .p8 file (Apple lets you download it once).
#   3. GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret:
#        ASC_KEY_ID      the key's Key ID
#        ASC_ISSUER_ID   the Issuer ID shown above the key list
#        ASC_KEY_P8      the whole text of the .p8 file, including the BEGIN/END lines
#        APPLE_TEAM_ID   your 10-character Team ID
#
# Signing is automatic: Xcode on the runner uses the API key to create or fetch the distribution certificate and
# provisioning profile (-allowProvisioningUpdates), so no certificates are stored in the repo.
# The build number is the GitHub run number, so every upload has a higher one than the last.
# The version shown to testers is MARKETING_VERSION in the Xcode project (bump it with each release).

name: Upload iOS build to TestFlight

on:
  workflow_dispatch: {}

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see the setup notes at the top of this workflow file)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install JS dependencies
        run: npm ci

      - name: Point build at www.hcri.io
        run: echo "export const HCRI_API_BASE = 'https://www.hcri.io';" > src/hcri/apiConfig.ts

      - name: Stamp git commit id into the build
        run: echo "export const GIT_COMMIT = '${GITHUB_SHA::7}';" > src/gitCommit.ts

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'package-lock.json') }}

      - name: Install CocoaPods
        working-directory: ios
        run: bundle exec pod install

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Archive (signed, Release)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/hCRICompanion.xcworkspace \
            -scheme hCRICompanion \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/hCRI.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive 2>&1 | tee xcodebuild-archive.log | tail -n 40

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/hCRI.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee xcodebuild-export.log | tail -n 40

      # `gh` in the authoring sandbox can't download logs, so surface the real errors as annotations on failure.
      - name: Annotate errors
        if: failure()
        run: |
          cat xcodebuild-archive.log xcodebuild-export.log 2>/dev/null | grep -E "error:|fatal error:|\*\* (ARCHIVE|EXPORT) FAILED|Undefined symbols|Provisioning|certificate" | head -n 20 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
